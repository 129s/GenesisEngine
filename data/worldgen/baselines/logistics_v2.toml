[world]
name = "baseline_logistics_v2"

[topology.cluster]
min_clusters = 1
max_clusters = 1
min_nodes_per_cluster = 4
max_nodes_per_cluster = 4

[topology.corridor]
enabled = false

[layout.grid]
cell_width = 7.0
cell_height = 5.0
columns = 2
margin = 2.0

[tilemap]
tile_size = 32
base_extent = 28

[worlddb.resources]
per_map = 4
types = ["Water", "Ore", "Food", "Social"]
weights = [1.0, 1.0, 1.0, 1.0]
capacity = 36
regen_per_step = 2

map_overrides = [
  { map = 1, types = ["Water"], weights = [1.0] },
  { map = 2, types = ["Ore"], weights = [1.0] },
  { map = 3, types = ["Food"], weights = [1.0] },
  { map = 4, types = ["Social"], weights = [1.0] }
]

[[worlddb.resources.workshop]]
output = "Food"
initial = 0
chance = 1.0
recipes = [
  { output_units = 3, inputs = [{ type = "Water", units = 2 }] },
  { output_units = 5, inputs = [{ type = "Water", units = 1 }, { type = "Ore", units = 1 }] }
]

[[worlddb.resources.workshop]]
output = "Social"
initial = 0
chance = 1.0
recipes = [
  { output_units = 2, inputs = [{ type = "Food", units = 1 }, { type = "Water", units = 1 }] },
  { output_units = 3, inputs = [{ type = "Food", units = 1 }, { type = "Ore", units = 1 }] }
]

