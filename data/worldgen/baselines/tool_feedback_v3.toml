[world]
name = "baseline_tool_feedback_v3"

[topology.cluster]
min_clusters = 2
max_clusters = 2
min_nodes_per_cluster = 3
max_nodes_per_cluster = 3

[topology.corridor]
enabled = true
min_length = 2
max_length = 2

[layout.grid]
cell_width = 6.0
cell_height = 5.0
columns = 3
margin = 2.0

[layout.cluster]
radial_distance = 24.0
radial_step = 6.0
node_spacing = 3.0

[layout.corridor]
step = 7.0

[tilemap]
tile_size = 32
base_extent = 32

[worlddb.resources]
per_map = 4
types = ["Water", "Food", "Social", "Ore", "Tool"]
weights = [2.0, 1.0, 1.0, 0.45, 0.20]
capacity = 40
regen_per_step = 2

[[worlddb.resources.workshop]]
output = "Tool"
initial = 0
chance = 1.0
recipes = [
  { output_units = 1, inputs = [{ type = "Ore", units = 3 }] }
]

[[worlddb.resources.workshop]]
output = "Food"
initial = 0
chance = 1.0
recipes = [
  { output_units = 3, inputs = [{ type = "Water", units = 2 }] },
  { output_units = 9, inputs = [{ type = "Water", units = 2 }, { type = "Tool", units = 1 }] }
]

[[worlddb.resources.workshop]]
output = "Social"
initial = 0
chance = 1.0
recipes = [
  { output_units = 2, inputs = [{ type = "Food", units = 1 }, { type = "Water", units = 1 }] },
  { output_units = 6, inputs = [{ type = "Food", units = 1 }, { type = "Tool", units = 1 }] }
]

